<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honest Questions</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Honest Questions</h1>
      </header>
      <div class="info-banner" role="note">
        <span class="info-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
        </span>
        <div>
          <p class="info-title">Have a question for leadership?</p>
          <p class="info-body">All questions are 100% anonymous, so everyone can ask freely.</p>
        </div>
      </div>
      <div class="top-right-controls">
        <div class="version" id="version-label">Loading...</div>
      </div>

      <section class="composer">
        <form id="question-form">
          <input
            id="question-input"
            type="text"
            name="question"
            placeholder="Ask a question"
            maxlength="280"
            autocomplete="off"
            required
          />
          <button type="submit">Submit</button>
        </form>
        <div class="meta">
          <span id="char-count">0 / 280</span>
          <div class="controls">
            <div class="sort-segmented" role="group" aria-label="Sort questions">
              <button class="sort-chip active" type="button" data-sort="top" aria-pressed="true">Top</button>
              <button class="sort-chip" type="button" data-sort="newest" aria-pressed="false">Newest</button>
              <button class="sort-chip" type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <ul id="questions" class="questions"></ul>
        <div class="pagination" aria-label="Questions pagination">
          <button id="prev-page-btn" type="button">Previous</button>
          <span id="page-label" class="page-label">Page 1 of 1</span>
          <button id="next-page-btn" type="button">Next</button>
        </div>
      </section>

      <section class="admin">
        <button id="admin-toggle" type="button" class="admin-toggle">Admin</button>
        <h2>Admin</h2>
        <form id="admin-login-form">
          <input
            id="admin-username"
            type="text"
            placeholder="Username"
            autocomplete="username"
          />
          <input
            id="admin-password"
            type="password"
            placeholder="Admin password"
            autocomplete="current-password"
          />
          <button type="submit">Login</button>
          <button id="admin-logout" type="button">Logout</button>
        </form>
        <div class="admin-actions">
          <button id="admin-clear" type="button">Clear all questions</button>
        </div>
        <p id="admin-status" class="admin-status"></p>
      </section>
      <div class="toast" id="toast" aria-live="polite"></div>
    </main>

    <template id="question-item-template">
      <li class="question">
        <div class="question-body">
          <span class="timestamp"></span>
          <div class="text"></div>
        </div>
        <div class="actions">
          <button class="vote" data-direction="up" aria-label="Upvote">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" focusable="false">
                <path d="M2 10h4v12H2zM8 10l5.5-7.5c.6-.8 1.6-1.2 2.6-1l.2.1c.8.3 1.3 1.1 1.2 2l-.6 5.4H22c1.1 0 2 .9 2 2 0 .2 0 .4-.1.6l-2.5 8.4c-.3.9-1.1 1.5-2.1 1.5H8V10z"/>
              </svg>
            </span>
            Upvote
          </button>
          <div class="score"></div>
          <button class="vote" data-direction="down" aria-label="Downvote">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" focusable="false">
                <path d="M2 2h4v12H2zM8 14l5.5 7.5c.6.8 1.6 1.2 2.6 1l.2-.1c.8-.3 1.3-1.1 1.2-2l-.6-5.4H22c1.1 0 2-.9 2-2 0-.2 0-.4-.1-.6L21.4 3.4c-.3-.9-1.1-1.5-2.1-1.5H8v12z"/>
              </svg>
            </span>
            Downvote
          </button>
          <button class="admin-delete" data-action="delete">Delete</button>
        </div>
      </li>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
